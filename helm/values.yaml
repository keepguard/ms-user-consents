image:
  repository: ghcr.io/keepguard/ms-user-consents
  tag: "1.0.1"
  pullPolicy: IfNotPresent

service:
  port: 8086

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

env:
  springProfilesActive: local
  serverPort: 8086
  redisHost: "redis"
  redisPort: 6379
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: "5672"
  postgresDb: "keepguard_api_db"
  postgresUser: "keepguard_api_user"

imagePullSecrets:
  - name: ghcr-secret
